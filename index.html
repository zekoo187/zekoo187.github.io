<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Symmetry apps</title>
<style>
  body{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;background:#232222;color:#f7f5f2;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
  main{max-width:520px;padding:32px}
  h1{font-size:22px;margin:0 0 8px} p{color:#bfbdbd;line-height:1.5;margin:0 0 20px}
  a{display:block;background:#c82030;color:#fff;text-decoration:none;padding:14px 18px;border-radius:10px;margin:0 0 12px;font-weight:600}
  a.alt{background:#3a3939}
</style>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));
    if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k)));
  }
</script>
</head>
<body>
<main>
  <h1>Symmetry Fitness &amp; Performance</h1>
  <p>This address no longer hosts an app. Pick the one you want.</p>
  <a href="https://zekoo187.github.io/symmetry-accountability/">Trainer accountability dashboard</a>
  <a class="alt" href="https://mysymmetry.netlify.app/">Vantage</a>
</main>
</body>
</html>
